<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Someone sent you a file — SpaceTime Drive</title>
<style>
  :root{
    --ground:#2a1236; --ground2:#3b1c4e; --glass:rgba(247,236,219,.06);
    --cream:#f7ecdb; --cream62:rgba(247,236,219,.62); --cream40:rgba(247,236,219,.4);
    --lilac:#c9a6ff; --terra:#e28c50; --terraHover:#f0a973; --sage:#b8cf8e;
    --divider:rgba(247,236,219,.15);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(120% 140% at 20% 0%, var(--ground2) 0%, var(--ground) 55%, #1d0c26 100%);
    color:var(--cream); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:24px;
  }
  .card{
    width:min(560px,100%); background:var(--glass); border:1px solid var(--divider);
    border-radius:30px; padding:40px 36px; text-align:center;
    box-shadow:0 24px 80px rgba(0,0,0,.45); backdrop-filter:blur(18px);
  }
  .mark{width:64px;height:64px;margin:0 auto 20px;border-radius:18px;
    background:linear-gradient(160deg,#cbaaff,#a678f5); display:flex;align-items:center;justify-content:center;
    box-shadow:0 10px 30px rgba(166,120,245,.35)}
  .mark svg{width:36px;height:36px}
  h1{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--cream62);font-weight:600;margin-bottom:10px}
  .file{font-size:26px;font-weight:800;word-break:break-word;line-height:1.25;margin-bottom:6px}
  .size{font-size:14px;color:var(--cream62);margin-bottom:26px}
  .preview{margin:0 0 26px;border-radius:18px;overflow:hidden;border:1px solid var(--divider);display:none;background:#000}
  .preview video,.preview img{width:100%;display:block;max-height:340px;object-fit:contain}
  .preview audio{width:100%;display:block;padding:14px;background:transparent}
  a.btn{
    display:inline-block; background:var(--terra); color:#2a1236; font-weight:800; font-size:17px;
    padding:16px 40px; border-radius:999px; text-decoration:none; transition:background .15s ease;
  }
  a.btn:hover{background:var(--terraHover)}
  .note{margin-top:18px;font-size:12.5px;color:var(--cream40)}
  .foot{margin-top:30px;padding-top:18px;border-top:1px solid var(--divider);font-size:12.5px;color:var(--cream40)}
  .foot a{color:var(--lilac);text-decoration:none}
  .err{display:none;font-size:15px;color:var(--cream62);line-height:1.5}
</style>
</head>
<body>
  <div class="card">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#2a1236" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2.4 L20.4 7.2 L20.4 16.8 L12 21.6 L3.6 16.8 L3.6 7.2 Z"/>
        <path d="M8.6 12 L15.4 12"/>
      </svg>
    </div>
    <h1>Someone sent you a file</h1>
    <div id="ok">
      <div class="file" id="name">…</div>
      <div class="size" id="size"></div>
      <div class="preview" id="preview"></div>
      <a class="btn" id="dl" href="#" download>Download</a>
      <div class="note">This link works for up to 7 days, then quietly retires.</div>
    </div>
    <div class="err" id="err">
      This share link looks incomplete — ask whoever sent it to copy it again from SpaceTime&nbsp;Drive.
    </div>
    <div class="foot">Shared from <a href="https://fraggleglam.github.io/spacetime-drive/">SpaceTime&nbsp;Drive</a> · files travel straight from the drive to you</div>
  </div>
<script>
(function(){
  var p = new URLSearchParams(location.hash.slice(1));
  var name = p.get("n"), size = parseInt(p.get("s")||"0",10), url = p.get("u");
  if(!name || !url){ document.getElementById("ok").style.display="none";
                     document.getElementById("err").style.display="block"; return; }
  document.getElementById("name").textContent = name;
  document.title = name + " — SpaceTime Drive";
  if(size>0){
    var units=["bytes","KB","MB","GB","TB"], i=0, v=size;
    while(v>=1024 && i<units.length-1){ v/=1024; i++; }
    document.getElementById("size").textContent = (i? v.toFixed(1): v)+" "+units[i];
  }
  var a=document.getElementById("dl"); a.href=url; a.setAttribute("download", name);
  var ext=(name.split(".").pop()||"").toLowerCase(), pv=document.getElementById("preview");
  var vids=["mp4","mov","m4v","webm"], auds=["mp3","m4a","wav","aac","aif","aiff"],
      imgs=["jpg","jpeg","png","gif","webp","heic"];
  if(vids.indexOf(ext)>=0){ pv.innerHTML='<video controls playsinline preload="metadata"></video>';
    pv.firstChild.src=url; pv.style.display="block"; }
  else if(auds.indexOf(ext)>=0){ pv.innerHTML='<audio controls preload="metadata"></audio>';
    pv.firstChild.src=url; pv.style.display="block"; }
  else if(imgs.indexOf(ext)>=0){ var im=new Image(); im.onload=function(){ pv.appendChild(im); pv.style.display="block"; };
    im.src=url; }
})();
</script>
</body>
</html>
